<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Module icon shown while the extension configuration is not usable.

    The rounded square is the same path as in Plugin.svg, so the module stays recognisable in the
    module menu, but the wordmark is replaced by an exclamation mark. Plugin.svg carries its
    wordmark as an embedded raster image; badging a copy of it would mean duplicating 30 kB that
    then silently goes stale the next time the logo changes.
-->
<svg width="100%" height="100%" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <g transform="matrix(1.040131,0,0,1.042335,-41.007401,-43.351433)">
        <path d="M1021.835,237.657L1021.835,827.934C1021.835,936.146 933.794,1024 825.353,1024L235.907,1024C127.466,1024 39.425,936.146 39.425,827.934L39.425,237.657C39.425,129.445 127.466,41.591 235.907,41.591L825.353,41.591C933.794,41.591 1021.835,129.445 1021.835,237.657Z" style="fill:rgb(204,37,37);"/>
    </g>
    <g style="fill:rgb(255,255,255);">
        <rect x="457" y="236" width="110" height="404" rx="55"/>
        <circle cx="512" cy="762" r="68"/>
    </g>
</svg>

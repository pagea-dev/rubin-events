<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:mlang_tabs_tab" /></h1>

    <!-- Settings indicator: green when nothing is wrong, red when everything is, yellow in between -->
    <f:be.infobox state="{configurationState}"
                  title="{f:translate(key: 'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.config.state.{configurationState}')}">

        <p><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.config.intro" /></p>

        <div class="table-fit">
            <table class="table table-sm mb-0">
                <tbody>
                    <f:for each="{configuration}" as="setting">
                        <tr>
                            <td class="col-icon">
                                <f:if condition="{setting.valid}">
                                    <f:then><core:icon identifier="actions-check" size="small" /></f:then>
                                    <f:else><core:icon identifier="actions-exclamation" size="small" /></f:else>
                                </f:if>
                            </td>
                            <td><code>{setting.key}</code></td>
                            <td>
                                <f:if condition="{setting.hasValue}">
                                    <f:then>{setting.value}</f:then>
                                    <f:else><em><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.config.notSet" /></em></f:else>
                                </f:if>
                            </td>
                            <td class="text-body-secondary">
                                <f:if condition="{setting.valid} == 0">
                                    <f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.config.hint.{setting.key}" />
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>

    </f:be.infobox>

    <f:if condition="{storagePid} == 0">
        <f:if condition="{configuredStoragePid} > 0">
            <f:then>
                <f:be.infobox state="2" title="{f:translate(key: 'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.missingStorage.title')}">
                    <f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.missingStorage.message" arguments="{0: configuredStoragePid}" />
                </f:be.infobox>
            </f:then>
            <f:else>
                <f:be.infobox state="1" title="{f:translate(key: 'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.noStorage.title')}">
                    <f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.noStorage.message" />
                </f:be.infobox>
            </f:else>
        </f:if>
    </f:if>

    <f:if condition="{upcoming} || {past}">
        <f:then>
            <f:render section="EventTable" arguments="{
                rows: upcoming,
                heading: '{f:translate(key: \'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.upcoming\')}',
                empty: '{f:translate(key: \'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.upcoming.empty\')}'
            }" />

            <f:render section="EventTable" arguments="{
                rows: past,
                heading: '{f:translate(key: \'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.past\')}',
                empty: '{f:translate(key: \'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.past.empty\')}'
            }" />
        </f:then>
        <f:else>
            <f:be.infobox state="-2" title="{f:translate(key: 'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.empty.title')}">
                <f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.empty.message" />
            </f:be.infobox>
        </f:else>
    </f:if>

    <f:render partial="Backend/Branding" arguments="{extensionVersion: extensionVersion}" />

</f:section>


<f:section name="EventTable">

    <h2>{heading}</h2>

    <f:if condition="{rows}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.col.start" /></th>
                            <th><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.col.end" /></th>
                            <th><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.col.title" /></th>
                            <th><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.col.location" /></th>
                            <th><f:translate key="LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.col.map" /></th>
                            <th class="col-control"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{rows}" as="row">
                            <tr>
                                <td><f:format.date format="d.m.Y H:i">{row.event.eventStart}</f:format.date></td>
                                <td>
                                    <f:if condition="{row.event.eventEnd}">
                                        <f:format.date format="d.m.Y H:i">{row.event.eventEnd}</f:format.date>
                                    </f:if>
                                </td>
                                <td>{row.event.title}</td>
                                <td>{row.event.location}</td>
                                <td>
                                    <f:if condition="{row.event.mapLocation}">
                                        <f:then><core:icon identifier="actions-check" size="small" /></f:then>
                                        <f:else><core:icon identifier="actions-close" size="small" /></f:else>
                                    </f:if>
                                </td>
                                <td class="col-control nowrap">
                                    <a class="btn btn-default" href="{row.editUrl}"
                                       title="{f:translate(key: 'LLL:EXT:rubin_events/Resources/Private/Language/locallang_mod.xlf:module.action.edit')}">
                                        <core:icon identifier="actions-open" size="small" />
                                    </a>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <p class="text-body-secondary">{empty}</p>
        </f:else>
    </f:if>

</f:section>

</html>
